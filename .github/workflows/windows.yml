name: Windows
on:
  push:
    branches: [main, windows-port, 'codex/**']
    paths: ['Windows/**', 'scripts/*windows*', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'scripts/*windows*', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s Windows/tests -v
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Native worker integration checks
        shell: pwsh
        run: .build/venv/Scripts/python.exe -m unittest discover -s Windows/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: Blah-Windows-x64
          path: |
            dist/Blah-Windows-x64.zip
            .build/windows/package-self-test.json
          if-no-files-found: error
  macos-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing Swift replacement tests
        run: |
          swiftc Sources/Blah/TextReplacement.swift Tests/TextReplacementTests.swift -o /tmp/blah-replacement-tests
          /tmp/blah-replacement-tests
